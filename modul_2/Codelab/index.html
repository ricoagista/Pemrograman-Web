<!-- Codelab: Simple API Demo with jsonplaceholder -->
<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codelab - Simple API Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-white text-[#1d1d1f] font-['SF_Pro_Text',system-ui,-apple-system,BlinkMacSystemFont,'Segoe_UI',Roboto,sans-serif] antialiased min-h-screen flex flex-col">
  <header class="sticky top-0 z-50 bg-[#000000]/90 backdrop-blur-md border-b border-[#333333]">
    <nav class="max-w-6xl mx-auto px-6 h-11 flex items-center justify-between">
      <a href="#demo" class="text-[14px] font-semibold tracking-tight text-white hover:text-[#cccccc] transition">Codelab</a>
      <div class="flex items-center gap-8 text-[12px] text-[#cccccc]">
        <a href="#results" class="hover:text-white transition">Hasil</a>
        <a href="#cards" class="hover:text-white transition">Card</a>
      </div>
    </nav>
  </header>

  <main class="flex-1">
    <!-- Results Section -->
    <section id="results" class="py-12">
      <h2 class="text-2xl sm:text-[34px] font-semibold text-[#1d1d1f] tracking-[-0.28px] mb-6">Hasil Data</h2>
      <div id="results-container">
        <!-- Results will be injected here -->
      </div>
    </section>

    <!-- Cards Section -->
    <section id="cards" class="py-12">
      <h2 class="text-2xl sm:text-[34px] font-semibold text-[#1d1d1f] tracking-[-0.28px] mb-6">Card Template</h2>
      <div id="cards-container">
        <!-- Cards will be injected here -->
      </div>
    </section>
  </main>

  <footer class="bg-[#f5f5f7] border-t border-[#e0e0e0] py-6 text-center text-[12px] text-[#7a7a7a]">
    <p>Codelab - Demonstrasi Fetch API Sederhana</p>
  </footer>
</body>
</html>
